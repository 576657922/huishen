<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>专注呼吸 · 练习中</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  .top { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 20px 0; height: 64px; }
  .top .meta { margin-top: 2px; }
  .rem { text-align: right; }
  .rem .num { display: block; font-size: var(--fs-readout); line-height: 32px; font-weight: 300; letter-spacing: 0; }
  .count { display: flex; justify-content: space-between; align-items: flex-end; padding: 64px 20px 0; }
  .count .big { display: flex; align-items: baseline; gap: 10px; }
  .count .big .num { font-size: var(--fs-display); line-height: 64px; font-weight: 300; letter-spacing: 0; }
  .count .big span:last-child { font-size: var(--fs-body); color: var(--ink-2); }
  .count .last { text-align: right; padding-bottom: 6px; }
  .count .last .num { color: var(--ink-2); }
  .tl { display: block; margin: 28px 20px 0; overflow: visible; }
  .gm { stroke: var(--ink-4); stroke-width: 1; }
  .gM { stroke: var(--ink-3); stroke-width: 1; }
  .tl-past { stroke: var(--ink-2); stroke-width: 1.5; }
  .tl-fut { stroke: var(--trace-future); stroke-width: 1.5; stroke-dasharray: 3 4; }
  .tk { stroke: var(--ink); stroke-width: 2; }
  .nowring { fill: var(--bg); }
  .nowdot { fill: var(--signal); }
  .ax { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-3); }
  .cue { margin: 20px 20px 0; color: var(--ink-3); }
  .catch { position: absolute; left: 20px; right: 20px; top: 420px; bottom: 124px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 8px; border: 1px solid var(--rule-strong); border-radius: var(--r-4); background: var(--bg-raised); }
  .catch .lbl { font-size: var(--fs-large); line-height: var(--lh-large); font-weight: 400; letter-spacing: .12em; padding-left: .12em; }
  .catch .sub { color: var(--ink-3); }
  .catch .alt { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; align-items: center; gap: 6px; color: var(--ink-3); }
  .catch .alt .kbd { border-color: var(--rule-strong); color: var(--ink-2); }
  .catch .led { position: absolute; top: 16px; left: 16px; width: 8px; height: 8px; background: var(--ink-4); }
  .ctrl { position: absolute; left: 20px; right: 20px; bottom: 52px; display: flex; justify-content: space-between; }
  .ctrl button { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px 0 12px; border: 1px solid var(--rule-strong); border-radius: var(--r-3); color: var(--ink); font-size: var(--fs-small); letter-spacing: .06em; }
  .ctrl button small { font-size: inherit; color: var(--ink-3); letter-spacing: 0; }
</style>
</head>
<body>

d="i-sensor" viewBox="0 0 24 24"><path d="M3.75 12h3.5l2-4.5 3.5 9 2-4.5h5.5"/></symbol></defs></svg>
