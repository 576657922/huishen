<style>
  .hdr { display: flex; justify-content: space-between; align-items: flex-start; padding: 8px 8px 0 20px; }
  .hdr p { margin-top: 2px; }
  .sec { padding: 0 20px; }
  .sec-h { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 7px; border-bottom: var(--hair) solid var(--rule-strong); }
  .now { margin-top: 24px; }
  .now h2 { margin-top: 14px; }
  .spec { display: flex; align-items: center; margin-top: 2px; font-size: var(--fs-small); line-height: var(--lh-small); color: var(--ink-2); }
  .spec { gap: 16px; }
  .spec .ev { display: inline-flex; align-items: center; gap: 6px; }
  .program { margin-top: 14px; }
  .program-svg { display: block; overflow: visible; }
  .pg-line { fill: none; stroke: var(--trace); stroke-width: 1.5; stroke-linejoin: miter; }
  .pg-band { fill: var(--trace-fill); }
  .pg-edge { stroke: var(--trace); stroke-width: 1; }
  .pg-lab text { font-family: var(--font-sans); font-size: 11px; fill: var(--ink-2); letter-spacing: .02em; }
  .pg-axis { stroke: var(--rule-strong); stroke-width: 1; }
  .pg-tick path { stroke: var(--ink-4); stroke-width: 1; }
  .pg-tick text { font-family: var(--font-mono); font-size: 11px; fill: var(--ink-3); }
  .desc { margin-top: 10px; }
  .now .btn-key { margin-top: 16px; }
  .quick li:last-child { border-bottom: 0; }
  .quick { margin-top: 24px; }
  .quick ul { margin-top: 0; }
  .quick li { display: grid; grid-template-columns: 48px 1fr auto 16px; align-items: center; column-gap: 14px; height: 48px; border-bottom: var(--hair) solid var(--rule); }
  
  .glyph { display: block; fill: none; stroke: var(--ink-2); stroke-width: 1.5; }
  .quick .dur { font-size: var(--fs-small); color: var(--ink-2); }
  .quick .chev { color: var(--ink-3); }
  .week { margin-top: 0; }
  .week-b { display: flex; justify-content: space-between; align-items: flex-end; padding-top: 12px; border-top: var(--hair) solid var(--rule-strong); }
  .week-b h3 { margin-bottom: 2px; }
  .week-b p { font-size: var(--fs-body); color: var(--ink-2); }
  .week-b .num.v { font-size: var(--fs-title); color: var(--ink); font-weight: 300; letter-spacing: 0; }
  .weekbars .wb { fill: var(--ink-3); }
  .weekbars .wb-today { fill: var(--ink); }
  .weekbars .wb-zero { fill: var(--ink-4); }
  .weekbars text { font-family: var(--font-sans); font-size: 11px; fill: var(--ink-3); }
  .weekbars text.now { fill: var(--ink); font-weight: 500; }
</style>
</head>
