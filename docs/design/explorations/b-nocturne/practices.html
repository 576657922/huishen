<style>
  .page { position: absolute; top: var(--status-h); left: 0; right: 0; bottom: 0; padding: 0 var(--gutter); }
  .hd { padding-top: 14px; display: flex; align-items: baseline; justify-content: space-between; }
  .hd .count { font-size: var(--fs-caption); color: var(--text-3); }
  .seg { margin-top: 14px; }

  .legend { display: flex; justify-content: space-between; align-items: baseline; margin-top: 20px; font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); }
  .axis { display: block; margin-top: 6px; overflow: visible; }
  .axis .tk line { stroke: var(--line-strong); }
  .axis .lbl text { font-size: 11px; fill: var(--text-3); font-family: var(--font-ui); font-variant-numeric: tabular-nums; }

  .list { margin-top: 4px; }
  .item { display: block; padding: 14px 0 14px; border-top: var(--hairline) solid var(--line); }
  .item .top { display: flex; justify-content: space-between; align-items: baseline; }
  .item .nm { font-size: var(--fs-headline); line-height: var(--lh-headline); font-weight: var(--fw-medium); letter-spacing: 0.02em; }
  .item .meta { font-size: var(--fs-caption); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .item .how { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); margin-top: 2px; }
  .wave { display: block; margin-top: 10px; overflow: visible; }
  .wave path { fill: none; stroke: var(--text-1); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .wave .tg line { stroke: var(--line); stroke-width: 1; }
  .wave .lbl text { font-size: 11px; fill: var(--text-3); font-family: var(--font-ui); text-anchor: middle; font-variant-numeric: tabular-nums; }
  .item.tool .nm::after { content: "工具"; margin-left: 8px; font-size: 11px; font-weight: var(--fw-regular); color: var(--text-3); letter-spacing: 0.06em; vertical-align: 2px; }
</style>
