<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F1">
<title>回神 · 今日</title>
<link rel="stylesheet" href="tokens.css">

<style>
  .page { position: absolute; top: var(--status-h); left: 0; right: 0; bottom: 0; padding: 0 var(--gutter); }

  /* header */
  .hd { position: relative; padding-top: 14px; }
  .hd .over { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); letter-spacing: 0.04em; }
  .hd h1 { margin-top: 2px; }
  .hd .icon-btn { position: absolute; right: -10px; top: 12px; }

  /* last 7 days */
  .week-row { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 18px; padding-bottom: 18px; border-bottom: var(--hairline) solid var(--line); }
  .week-row .lab { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); }
  .week-row .val { font-size: var(--fs-headline); line-height: var(--lh-headline); font-weight: var(--fw-semibold); margin-top: 2px; }
  .week-row .val small { font-size: var(--fs-caption); font-weight: var(--fw-regular); color: var(--text-2); margin-left: 6px; }
  .week { display: block; }
  .week .bar { fill: var(--heat-2); }
  .week .bar.today { fill: var(--accent); }
  .week .none { fill: var(--line-strong); }
  .week .base { stroke: var(--line); }
  .week text { font-size: 11px; fill: var(--text-3); font-family: var(--font-ui); }
  .week text.today { fill: var(--text-1); font-weight: 600; }

  /* tonight */
  .hero { padding-top: 22px; }
  .hero .over { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); letter-spacing: 0.02em; }
  .hero .over b { color: var(--text-1); font-weight: var(--fw-semibold); }
  .hero h2 { margin-top: 6px; }
  .hero .meta { font-size: var(--fs-caption); line-height: var(--lh-caption); color: var(--text-2); margin-top: 2px; }
  .hero p.desc { margin-top: 12px; color: var(--text-1); text-wrap: pretty; }
  .scanmap { display: block; margin-top: 16px; overflow: visible; }
  .scanmap .seg { stroke: var(--text-2); stroke-width: 1.5; stroke-linecap: round; }
  .scanmap .div { stroke: var(--line-strong); stroke-width: 1; }
  .scanmap .start { fill: var(--accent); }
  .scanmap text { font-size: 11px; fill: var(--text-3); font-family: var(--font-ui); letter-spacing: 0.02em; }
  .actions { display: flex; align-items: center; gap: 8px; margin-top: 18px; }

  /* quick starts */
  .quick { margin-top: 26px; }
  .quick .sh { display: flex; justify-content: space-between; align-items: baseline; }
  .quick .sh h3 { font-size: var(--fs-caption); line-height: var(--lh-caption); font-weight: var(--fw-semibold); color: var(--text-2); letter-spacing: 0.06em; }
  .quick .sh a { font-size: var(--fs-caption); color: var(--accent); display: flex; align-items: center; gap: 2px; }
  .quick .sh a .i { width: 14px; height: 14px; stroke-width: 2px; }
  .qrow { display: grid; grid-template-columns: 56px 1fr auto 16px; align-items: center; column-gap: 12px; height: 62px; position: relative; }
  .qrow + .qrow::before { content: ""; position: absolute; left: 68px; right: 0; top: 0; height: 1px; background: var(--line); }
  .qrow .glyph { stroke: var(--text-1); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .qrow .wave path { stroke: var(--text-1); fill: none; stroke-width: 1.5; stroke-linecap: round; }
  .qrow .nm { font-size: var(--fs-headline); line-height: 22px; font-weight: var(--fw-medium); letter-spacing: 0.02em; }
  .qrow .sub { font-size: var(--fs-caption); line-height: 18px; color: var(--text-2); margin-top: 2px; }
  .qrow .dur { font-size: var(--fs-body); color: var(--text-2); font-variant-numeric: tabular-nums; }
  .qrow .chev { width: 16px; height: 16px; color: var(--text-3); stroke-width: 2px; }
</style>
</head>
