<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>回神 · 声音实验室</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #23211c;
        --bg: #f4f1ea;
        --line: #d8d2c4;
        --ok: #2f6b3a;
        --bad: #a3342b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ece8de;
          --bg: #1c1b18;
          --line: #3a3832;
          --ok: #7fbf8a;
          --bad: #e08a80;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.5 system-ui, -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      h2 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      section {
        border-top: 1px solid var(--line);
        padding: 12px 0;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
      }
      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
      }
      button {
        min-height: 36px;
        padding: 0 12px;
        font: inherit;
      }
      button.on {
        outline: 2px solid currentColor;
      }
      .slider {
        display: inline-flex;
        gap: 6px;
        align-items: center;
      }
      .status,
      .progress {
        opacity: 0.8;
      }
      .qa {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        font-variant-numeric: tabular-nums;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 2px 8px;
        text-align: right;
        white-space: nowrap;
      }
      th:first-child,
      td:first-child,
      td:last-child {
        text-align: left;
      }
      tr.ok td:last-child {
        color: var(--ok);
      }
      tr.bad td {
        color: var(--bad);
      }
      textarea {
        width: 100%;
        max-width: 720px;
        font: 12px/1.4 ui-monospace, monospace;
      }
    </style>
  </head>
  <body>
    <main id="lab"></main>
    <script type="module" src="/src/audio/lab/main.ts"></script>
  </body>
</html>
